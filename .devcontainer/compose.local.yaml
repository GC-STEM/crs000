# Run from the course repository root with:
# docker compose -f .devcontainer/compose.local.yaml run --build --rm soe
services:
  soe:
    image: gc-stem-course:local
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspaces/course
    volumes:
      - type: bind
        source: ..
        target: /workspaces/course
        bind:
          create_host_path: false
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        /opt/gc-stem/runtime/bin/python /opt/gc-stem/soe/scripts/python/soe.py setup --workspace /workspaces/course
        exec bash
